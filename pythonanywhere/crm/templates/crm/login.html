{% extends 'crm/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:360px;margin:12vh auto 0">
  <form method="post" class="card pad">
    {% csrf_token %}
    <h1 style="margin:0;font-size:20px">Infinite Soft Tech CRM</h1>
    <p class="muted" style="margin:2px 0 8px">Sign in to continue</p>
    {% if form.errors %}<div class="msg error">Wrong username or password.</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username</label>
    <input name="username" autocomplete="username" autofocus required>
    <label>Password</label>
    <input name="password" type="password" autocomplete="current-password" required>
    <button class="btn p" style="width:100%;justify-content:center;margin-top:14px">Sign in</button>
  </form>
</div>
{% endblock %}
